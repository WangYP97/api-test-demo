name: API Test Pipeline

# 1. 什么时候触发？（当代码 push 或 pull request 时）
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 2. 干什么活？
jobs:
  test:
    # 在什么环境跑？（GitHub 免费提供的 Ubuntu 服务器）
    runs-on: ubuntu-latest

    steps:
    # 第一步：把你的代码拉到服务器上
    - name: Checkout code
      uses: actions/checkout@v3

    # 第二步：装 Python 环境
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 第三步：装依赖（顺便配个清华源提速）
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple

    # 第四步：跑测试用例
    - name: Run Pytest
      run: |
        pytest test_demo.py -v